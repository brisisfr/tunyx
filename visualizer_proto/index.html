<!DOCTYPE html>
<html>
<body style="background:#151321; color:#e8e3f5; font-family:sans-serif;">
  <audio id="audio" src="test.mp3"></audio>
  <button id="play">Play</button>
  <br><br>
  <canvas id="viz" width="640" height="140"></canvas>
  <br>
  <canvas id="bar" width="640" height="32" style="margin-top:-12px; touch-action:none; cursor:pointer;"></canvas>
  <div id="time" style="font-variant-numeric:tabular-nums; color:#a79bb8; font-size:14px; margin-top:4px;">0:00 / 0:00</div>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('play');
    let ctx, analyser, data;

    btn.addEventListener('click', async () => {
      if (!ctx) {
        ctx = new AudioContext();
        const src = ctx.createMediaElementSource(audio);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.minDecibels = -75;
        analyser.maxDecibels = -15;
        analyser.smoothingTimeConstant = 0.3;
        src.connect(analyser);
        analyser.connect(ctx.destination);
        data = new Uint8Array(analyser.frequencyBinCount);
      }
      await ctx.resume();
      audio.paused ? audio.play() : audio.pause();
    });

    const canvas = document.getElementById('viz');
    const g = canvas.getContext('2d');

    const BARS = 32, BAR_W = 10, MIN_H = 10, MAX_H = 100;
    const GAP = (canvas.width - BARS * BAR_W) / (BARS - 1);
    const LO_BIN = 2, HI_BIN = 372;   // ~43 Hz to ~8 kHz
    const smooth = new Array(BARS).fill(0);
    let avgBass = 0, kick = 0;
    const COLORS = ['#bc74e2', '#A493F0', '#55C9D8'];   // lavender, indigo, azure
    const CYCLE_SPEED = 0.15;                           // cycles per second
    const PAD = 14;   // room so the glow isn't cut off at the canvas edges

    function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }

    // color of the moving gradient at canvas x (same math as the 7 stops)
    function colorAt(x, s, P) {
      const c = ((((x - s) / P) % 1) + 1) % 1 * 3;
      const i = Math.floor(c), t = c - i;
      const a = hex(COLORS[i % 3]), b = hex(COLORS[(i + 1) % 3]);
      return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(',')})`;
    }

    const bar = document.getElementById('bar');
    const bg = bar.getContext('2d');
    const BAR_H = 3;
    let dragging = false, dragFrac = 0;
    const timeEl = document.getElementById('time');
    const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

    function fracFromEvent(e) {
      const r = bar.getBoundingClientRect();
      return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    }

    bar.addEventListener('pointerdown', e => {
      if (!audio.duration) return;
      dragging = true;
      bar.setPointerCapture(e.pointerId);
      dragFrac = fracFromEvent(e);
    });
    bar.addEventListener('pointermove', e => { if (dragging) dragFrac = fracFromEvent(e); });
    bar.addEventListener('pointerup', e => {
      if (!dragging) return;
      dragging = false;
      audio.currentTime = fracFromEvent(e) * audio.duration;
    });
    bar.addEventListener('pointercancel', () => { dragging = false; });

    function draw() {
      requestAnimationFrame(draw);
      g.clearRect(0, 0, canvas.width, canvas.height);
      if (analyser) analyser.getByteFrequencyData(data);
      const actual = audio.duration ? audio.currentTime / audio.duration : 0;
      const progress = dragging ? dragFrac : actual;
      const lit = progress * BARS;

      let bass = 0;
      for (let i = 0; i < 4; i++) bass += smooth[i] / 4;   // lowest 4 frequency bars
      avgBass += (bass - avgBass) * 0.02;
      const spike = Math.max(0, bass - avgBass - 0.08);
      kick = Math.min(1, Math.max(kick * 0.88, spike * 3));

      const P = canvas.width;                              // one full color cycle = row width
      const phase = (performance.now() / 1000 * CYCLE_SPEED) % 1;
      const s = -P + phase * P;                            // slides the gradient right
      const grad = g.createLinearGradient(s, 0, s + 2 * P, 0);
      for (let n = 0; n <= 6; n++) grad.addColorStop(n / 6, COLORS[n % 3]);

      for (let i = 0; i < BARS; i++) {
        const f = BARS - 1 - i;
        let level = 0;
        if (analyser) {
          const a = Math.floor(LO_BIN * Math.pow(HI_BIN / LO_BIN, i / BARS));
          const b = Math.max(a + 1, Math.floor(LO_BIN * Math.pow(HI_BIN / LO_BIN, (i + 1) / BARS)));
          let sum = 0;
          for (let k = a; k < b; k++) sum += data[k];
          level = sum / (b - a) / 255;
          level = Math.pow(level, 1.7);
        }
        const prev = smooth[i];
        smooth[i] = level > prev ? prev + (level - prev) * 0.6
                                 : prev + (level - prev) * 0.15;
        level = smooth[i];
        const h = Math.min(canvas.height - PAD * 2, (MIN_H + level * (MAX_H - MIN_H)) * (1 + kick * 0.35));
        const x = f * (BAR_W + GAP), y = canvas.height - PAD - h;

        const fa = Math.min(1, Math.max(0, lit - f));   // how much of this pill is lit
        if (fa > 0) {
          g.save();
          g.shadowColor = colorAt(x + BAR_W / 2, s, P);
          g.shadowBlur = 8 + kick * 14;                 // glow swells on bass hits
          g.globalAlpha = fa;                           // half-lit pill = half glow
          g.fillStyle = '#6e6794';
          g.beginPath();
          g.roundRect(x, y, BAR_W, h, BAR_W / 2);
          g.fill();
          g.restore();
        }

        // 1. dim pill, always drawn
        g.fillStyle = '#6e6794';
        g.beginPath();
        g.roundRect(x, y, BAR_W, h, BAR_W / 2);
        g.fill();

        // 2. lit color, clipped to the pill, covering only its left part
        const fill = Math.min(1, Math.max(0, lit - f));
        if (fill > 0) {
          g.save();
          g.clip();                         // clips to the pill path from step 1
          g.fillStyle = grad;
          g.fillRect(x, y, BAR_W * fill, h);
          g.restore();
        }
      }

      bg.clearRect(0, 0, bar.width, bar.height);
      const by = (bar.height - BAR_H) / 2;

      if (progress > 0) {
        bg.save();
        bg.shadowColor = colorAt(bar.width * progress, s, P);
        bg.shadowBlur = 6;
        bg.fillStyle = '#6e6794';
        bg.beginPath();
        bg.roundRect(0, by, Math.max(BAR_H, bar.width * progress), BAR_H, BAR_H / 2);
        bg.fill();
        bg.restore();
      }

      bg.fillStyle = '#6e6794';                       // track
      bg.beginPath();
      bg.roundRect(0, by, bar.width, BAR_H, BAR_H / 2);
      bg.fill();

      bg.save();
      bg.beginPath();
      bg.roundRect(0, by, bar.width, BAR_H, BAR_H / 2);
      bg.clip();                                       // clip to the pill
      bg.fillStyle = grad;                             // same moving gradient
      bg.fillRect(0, by, bar.width * progress, BAR_H);
      bg.restore();

      const dur = audio.duration || 0;
      timeEl.textContent = `${fmt(dragging ? dragFrac * dur : audio.currentTime)} / ${fmt(dur)}`;
    }
    draw();
  </script>
</body>
</html>
